name: Windows Qt build (TEST FIXTURE, UNVERIFIED)

# Manual only. No release, no signing, no push, no external repository creation.
# Toolchain: MSYS2 CLANG64 only. No MSVC / MINGW / CLANG64 mixing.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: windows x64 / CLANG64 / Qt6
    runs-on: windows-latest
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Setup MSYS2 CLANG64
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: git

      # Diagnose before installing. No package name, version or architecture is
      # changed here; this only records what pacman can actually see on the runner.
      - name: Diagnose MSYS2 package database
        shell: msys2 {0}
        run: |
          set -o pipefail
          mkdir -p _logs
          {
            echo "MSYSTEM=${MSYSTEM:-unset}"
            echo "pacman=$(command -v pacman || echo MISSING)"
            echo "--- repositories ---"
            pacman-conf --repo-list 2>&1 || echo "pacman-conf unavailable"
            echo "--- dependency file (first 80 lines, escaped) ---"
            sed -n '1,80l' scripts/msys2_deps.txt
            echo "--- sample package query ---"
            pacman -Si git mingw-w64-clang-x86_64-clang mingw-w64-clang-x86_64-qt6-base 2>&1 || true
          } 2>&1 | tee _logs/00-msys2-diagnostics.log

      # Preserve the MSYS2 diagnostics even if a later step fails.
      - name: Upload MSYS2 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maksa-msys2-diagnostics-${{ github.run_number }}
          path: _logs/00-*.log
          if-no-files-found: warn

      - name: Install pinned CLANG64 dependencies
        shell: msys2 {0}
        run: |
          set -euo pipefail
          mkdir -p _logs

          # Read the list as a bash array: tolerate CRLF, blank lines and comments.
          # Never pass an unquoted word-split string to pacman.
          mapfile -t PACKAGES < <(sed -e 's/\r$//' -e '/^[[:space:]]*#/d' -e '/^[[:space:]]*$/d' scripts/msys2_deps.txt)
          [ "${#PACKAGES[@]}" -gt 0 ] || { echo "empty dependency list" >&2; exit 1; }
          printf 'package_count=%s\n' "${#PACKAGES[@]}" | tee _logs/00-package-targets.log
          printf '%s\n' "${PACKAGES[@]}" | tee -a _logs/00-package-targets.log

          # setup-msys2 already ran with update: true. Do not refresh or alter
          # repositories here: record the real lookup failure and stop instead.
          if ! pacman -Si \
            git \
            mingw-w64-clang-x86_64-clang \
            mingw-w64-clang-x86_64-qt6-base \
            > _logs/00-package-probe.log 2>&1; then
            cat _logs/00-package-probe.log
            echo "Package lookup failed after MSYS2 setup; inspect diagnostics." >&2
            exit 1
          fi

          pacman -S --noconfirm --needed "${PACKAGES[@]}" 2>&1 | tee -a _logs/00-pacman.log

      - name: Record versions and pins
        shell: msys2 {0}
        run: |
          set -o pipefail
          {
            echo "runner: windows-latest / MSYSTEM=${MSYSTEM:-unset}"
            echo "this repo: $(git rev-parse HEAD)"
            echo "--- clang ---"; clang++ --version
            echo "--- cmake ---"; cmake --version
            echo "--- qmake ---"; qmake6 -v || true
            echo "--- upstream pin ---"; cat upstream/workrave.txt
          } 2>&1 | tee _logs/01-versions.log

      # Stage 0: exact upstream source, unmodified.
      - name: Fetch pinned Workrave source
        shell: msys2 {0}
        run: |
          set -o pipefail
          bash scripts/fetch_upstream.sh "$PWD/upstream/workrave" 2>&1 | tee _logs/02-fetch-upstream.log

      # Stage 1: base build, no Maksa changes applied.
      - name: Build unmodified Workrave with Qt
        shell: msys2 {0}
        run: |
          set -o pipefail
          bash scripts/msys2_build.sh "$PWD/upstream/workrave" "$PWD/build/base" 2>&1 | tee _logs/03-base-build.log

      # Stage 2: independent core tests on Windows.
      - name: Run independent core tests
        shell: msys2 {0}
        run: |
          set -o pipefail
          bash scripts/run_core_tests.sh "$PWD/build/core" 2>&1 | tee _logs/04-core-tests.log

      # Stage 3: apply our versioned changes.
      - name: Apply Maksa integration patch
        shell: msys2 {0}
        run: |
          set -o pipefail
          bash scripts/apply_integration.sh "$PWD/upstream/workrave" 2>&1 | tee _logs/05-apply-patch.log

      # Stage 4: compile the real bridge and config backend inside Workrave.
      - name: Build patched Workrave
        shell: msys2 {0}
        run: |
          set -o pipefail
          bash scripts/msys2_build.sh "$PWD/upstream/workrave" "$PWD/build/patched" 2>&1 | tee _logs/06-patched-build.log

      # Stage 5: test-fixture portable bundle, not an installer.
      - name: Package test artifact
        shell: msys2 {0}
        run: |
          set -o pipefail
          bash scripts/package_windows.sh \
            "$PWD/build/patched" \
            "$PWD/artifacts/maksa-test-fixture" \
            "$PWD/upstream/workrave" 2>&1 | tee _logs/07-package.log

      - name: Reject empty or incomplete artifact
        shell: msys2 {0}
        run: |
          set -euo pipefail
          A="artifacts/maksa-test-fixture"
          [ -s "$A/workrave.exe" ] || { echo "missing workrave.exe" >&2; exit 1; }
          [ -s "$A/maksa/test_exercises.tsv" ] || { echo "missing fixture data" >&2; exit 1; }
          [ -s "$A/README-TEST.txt" ] || { echo "missing test notice" >&2; exit 1; }
          [ -s "$A/THIRD_PARTY.md" ] || { echo "missing attribution" >&2; exit 1; }
          echo "artifact completeness check passed"

      - name: Upload build and test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maksa-logs-${{ github.run_number }}
          path: _logs
          if-no-files-found: warn

      - name: Upload test artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: maksa-test-fixture-x64-${{ github.run_number }}
          path: artifacts/maksa-test-fixture
          if-no-files-found: error
